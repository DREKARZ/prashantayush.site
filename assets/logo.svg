<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#161F33"/>
    </linearGradient>

    <!-- Electric Indigo Accent Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Neon Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Amber Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Pattern Clip for Photo Avatar Frame -->
    <clipPath id="avatarClip">
      <circle cx="100" cy="92" r="55"/>
    </clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes spinRing {
      0% { transform: rotate(0deg); transform-origin: 100px 100px; }
      100% { transform: rotate(360deg); transform-origin: 100px 100px; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: scale(0.98); transform-origin: 100px 100px; }
      50% { opacity: 1; transform: scale(1.03); transform-origin: 100px 100px; }
      100% { opacity: 0.6; transform: scale(0.98); transform-origin: 100px 100px; }
    }
    .animated-ring {
      animation: spinRing 12s linear infinite;
    }
    .animated-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Outer Animated Glowing Polygon Emblem -->
  <polygon class="animated-glow" points="100,10 178,55 178,145 100,190 22,145 22,55" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Rotating Tech Ring -->
  <circle class="animated-ring" cx="100" cy="100" r="76" fill="none" stroke="url(#indigoGrad)" stroke-width="3" stroke-dasharray="12,12"/>

  <!-- Photo Clip Image Frame with Fallback Silhouette Vector -->
  <g clip-path="url(#avatarClip)">
    <circle cx="100" cy="100" r="58" fill="#0F1523"/>
    <!-- Embedded Profile Image -->
    <image href="profile.jpg" x="42" y="34" width="116" height="116" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Animated Ring Border over Profile Picture -->
  <circle cx="100" cy="92" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- PA Monogram Tag Badge -->
  <rect x="65" y="148" width="70" height="28" rx="14" fill="url(#indigoGrad)" stroke="url(#cyanGrad)" stroke-width="2"/>
  <text x="100" y="167" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">P A</text>

  <!-- Pulse Core Dots -->
  <circle class="animated-glow" cx="100" cy="22" r="5" fill="url(#cyanGrad)"/>
  <circle class="animated-glow" cx="100" cy="178" r="5" fill="url(#goldGrad)"/>
</svg>
