<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#182236"/>
    </linearGradient>

    <!-- Accent Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Emblem -->
  <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" fill="url(#bgGrad)" stroke="url(#amberGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Inner Architectural Grid Line (Civil Engineering) -->
  <path d="M45,65 L100,33 L155,65 L155,135 L100,167 L45,135 Z" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Stylized PA Monogram -->
  <!-- 'P' Letter Vector -->
  <path d="M60,60 L60,140 M60,60 L95,60 C110,60 110,95 95,95 L60,95" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 'A' Letter Vector -->
  <path d="M110,140 L135,60 L160,140 M120,112 L150,112" fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tech AI Pulse Dot -->
  <circle cx="100" cy="33" r="6" fill="url(#blueGrad)"/>
  <circle cx="100" cy="167" r="6" fill="url(#amberGrad)"/>
</svg>
