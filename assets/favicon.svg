<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="favClip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="#080C14"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="url(#favGrad)" stroke-width="3"/>

  <!-- Profile Image Clip -->
  <g clip-path="url(#favClip)">
    <circle cx="50" cy="50" r="38" fill="#0F1523"/>
    <image href="profile.jpg" x="12" y="12" width="76" height="76" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Glowing Border Circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="50" cy="10" r="4" fill="#06B6D4"/>
</svg>
